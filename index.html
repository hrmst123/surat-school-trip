<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงทะเบียนศึกษาดูงาน | ร.ร.เมืองสุราษฎร์ธานี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 md:p-8">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-blue-800">ระบบจัดการศึกษาดูงาน</h2>
      <p class="text-gray-500">กลุ่มบริหารงานบุคคล โรงเรียนเมืองสุราษฎร์ธานี</p>
    </div>

    <!-- ส่วนที่ 1: Login -->
    <div id="loginSection" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">รหัสประจำตัวครู/บุคลากร</label>
        <input type="text" id="empId" class="mt-1 block w-full rounded-lg border-gray-300 border p-3 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="กรอกรหัสประจำตัว">
      </div>
      <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
        เข้าสู่ระบบ
      </button>
    </div>

    <!-- ส่วนที่ 2: ฟอร์มข้อมูล -->
    <div id="formSection" class="hidden space-y-6">
      <div class="bg-blue-50 p-4 rounded-lg flex justify-between items-center">
        <div>
          <p class="text-sm text-gray-500">ยินดีต้อนรับ</p>
          <p id="userName" class="font-bold text-blue-900 text-lg"></p>
        </div>
        <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-semibold">กำลังดำเนินการ</span>
      </div>

      <!-- การเดินทาง -->
      <div class="border border-gray-200 rounded-xl p-5">
        <h3 class="font-semibold text-lg text-gray-800 mb-3">1. การเดินทาง</h3>
        <div class="flex flex-col space-y-2">
          <label class="inline-flex items-center">
            <input type="radio" name="transport" value="รถทัวร์" class="form-radio h-5 w-5 text-blue-600" checked>
            <span class="ml-2 text-gray-700">รถทัวร์ (โรงเรียนจัดให้)</span>
          </label>
          <label class="inline-flex items-center">
            <input type="radio" name="transport" value="รถส่วนตัว" class="form-radio h-5 w-5 text-blue-600">
            <span class="ml-2 text-gray-700">รถส่วนตัว (ใช้งบฯตนเอง)</span>
          </label>
        </div>
      </div>

      <!-- ผู้ติดตาม -->
      <div class="border border-gray-200 rounded-xl p-5">
        <h3 class="font-semibold text-lg text-gray-800 mb-3">2. ผู้ติดตาม</h3>
        <select id="hasFollower" onchange="toggleFollower()" class="w-full border border-gray-300 p-2 rounded-lg mb-4 focus:ring-blue-500 focus:border-blue-500">
          <option value="no">ไม่มีผู้ติดตาม</option>
          <option value="yes">มีผู้ติดตาม</option>
        </select>

        <div id="followerContainer" class="hidden space-y-3">
          <div id="followerList"></div>
          <button onclick="addFollower()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-800 py-2 px-4 rounded-lg flex items-center transition">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            เพิ่มผู้ติดตาม
          </button>
        </div>
      </div>

      <button onclick="submitData()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
        บันทึกข้อมูล
      </button>
    </div>

  </div>

  <script>
    // ใส่ลิงก์ API ของคุณตรงนี้
    const API_URL = 'https://script.google.com/macros/s/AKfycbwimbnWFaouMfJ-LYScYg7th8YuN_ImCyDo05CVMB9zVIfxZgBB9fEX4h7uYxyvTmWp8Q/exec';
    
    let followerCount = 0;
    let followerIdCounter = 0;

    async function login() {
      const empId = document.getElementById('empId').value;
      if(!empId) {
        Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกรหัสประจำตัว' });
        return;
      }

      Swal.fire({ title: 'กำลังตรวจสอบ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
          body: JSON.stringify({ action: 'login', empId: empId })
        });
        const res = await response.json();

        if(res.success) {
          if(res.status === 'Submitted') {
             Swal.fire({ icon: 'info', title: 'คุณได้ตอบแบบสอบถามไปแล้ว', text: 'หากต้องการแก้ไข โปรดติดต่อแอดมิน' });
          } else {
             Swal.fire({ icon: 'success', title: 'สำเร็จ', text: 'เข้าสู่ระบบเรียบร้อย', timer: 1500, showConfirmButton: false });
             document.getElementById('loginSection').classList.add('hidden');
             document.getElementById('formSection').classList.remove('hidden');
             document.getElementById('userName').innerText = res.name;
          }
        } else {
          Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: res.message });
        }
      } catch (error) {
        Swal.fire({ icon: 'error', title: 'การเชื่อมต่อขัดข้อง', text: 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้' });
      }
    }

    function toggleFollower() {
      const hasFollower = document.getElementById('hasFollower').value;
      const container = document.getElementById('followerContainer');
      if (hasFollower === 'yes') {
        container.classList.remove('hidden');
        if(followerCount === 0) addFollower();
      } else {
        container.classList.add('hidden');
        document.getElementById('followerList').innerHTML = '';
        followerCount = 0;
      }
    }

    function addFollower() {
      followerCount++;
      followerIdCounter++;
      const id = `follower_${followerIdCounter}`;
      const html = `
        <div id="${id}" class="follower-item bg-gray-50 p-4 rounded-lg border border-gray-200 relative mb-2">
          <button onclick="removeFollower('${id}')" class="absolute top-2 right-2 text-red-500 hover:text-red-700 text-sm">✕ ลบ</button>
          <p class="font-medium text-sm text-gray-700 mb-2">รายละเอียดผู้ติดตาม</p>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-gray-500">เพศ</label>
              <select class="f-gender w-full border p-2 rounded"><option value="ชาย">ชาย</option><option value="หญิง">หญิง</option></select>
            </div>
            <div>
              <label class="text-xs text-gray-500">อายุ</label>
              <select class="f-age w-full border p-2 rounded">
                <option value="ต่ำกว่า 12 ปี">ต่ำกว่า 12 ปี</option>
                <option value="มากกว่า 12 ปี">มากกว่า 12 ปี (ใช้โควตาห้องพัก)</option>
              </select>
            </div>
          </div>
        </div>
      `;
      document.getElementById('followerList').insertAdjacentHTML('beforeend', html);
    }

    function removeFollower(id) {
      document.getElementById(id).remove();
      followerCount--;
      if(followerCount === 0) {
        document.getElementById('hasFollower').value = 'no';
        toggleFollower();
      }
    }

    function submitData() {
      Swal.fire({
        title: 'ยืนยันการส่งข้อมูล?',
        text: "โปรดตรวจสอบข้อมูลให้ถูกต้องก่อนบันทึก",
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#16a34a',
        cancelButtonColor: '#d33',
        confirmButtonText: 'ยืนยันการบันทึก',
        cancelButtonText: 'ยกเลิก'
      }).then(async (result) => {
        if (result.isConfirmed) {
          
          Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

          const empId = document.getElementById('empId').value;
          const transport = document.querySelector('input[name="transport"]:checked').value;
          const hasFollower = document.getElementById('hasFollower').value;
          
          let followerDetails = "-";
          if(hasFollower === 'yes') {
            let detailsArray = [];
            document.querySelectorAll('.follower-item').forEach((item, index) => {
              const gender = item.querySelector('.f-gender').value;
              const age = item.querySelector('.f-age').value;
              detailsArray.push(`คนที่ ${index+1}: ${gender} (${age})`);
            });
            followerDetails = detailsArray.join(", ");
          }

          const payload = {
            action: 'submitData',
            empId: empId,
            transport: transport,
            hasFollower: hasFollower === 'yes' ? 'มี' : 'ไม่มี',
            followerDetails: followerDetails
          };

          try {
            const response = await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(payload)
            });
            const res = await response.json();

            if(res.success) {
              Swal.fire('บันทึกสำเร็จ!', 'ข้อมูลของคุณถูกส่งไปยังระบบแล้ว', 'success').then(() => {
                location.reload(); 
              });
            } else {
              Swal.fire('ผิดพลาด', res.message, 'error');
            }
          } catch(error) {
            Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
          }
        }
      });
    }
  </script>
</body>
</html>
